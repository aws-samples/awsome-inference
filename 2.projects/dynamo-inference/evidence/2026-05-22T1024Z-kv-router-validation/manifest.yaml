notes: |
  Frontend log proofs of KV router activation (all 5 required lines present in 05-frontend-kv-router.log of each sub-experiment):
    EventSubscriber created topic=kv_metrics transport=Nats
    Prefill model detected, registering and activating prefill router
    Activating prefill router router_mode=RoundRobin
    Prefill router activated successfully router_mode=RoundRobin
    KvWorkerMonitor: prefill endpoint watcher activated, tracking 1 workers

  Lessons captured (see VERDICT.md):
    - Operator label is `nvidia.com/dynamo-graph-deployment-name`, NOT `app.kubernetes.io/part-of`
    - hostNetwork:true + replicas>1 collides on host ports (DYN_SYSTEM_PORT=9090, NIXL side channel 5700)
    - Anti-affinity by hostname forces 1 pod/node — replicas>1 fails on 2-node cluster
    - Stale ETCD coordination state must be cleared between runs: kubectl exec dynamo-platform-etcd-0 -- etcdctl del --prefix "xferbench"
    - --disaggregation-mode regex strip artifact: leaves `\\ \\` that breaks vLLM arg parser
