        dnsPolicy: ClusterFirstWithHostNet
        tolerations:
          - { key: nvidia.com/gpu, operator: Exists, effect: NoSchedule }
        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/part-of
                      operator: In
                      values: [trtllm-disagg]
                topologyKey: kubernetes.io/hostname
        volumes:
          - name: dev-infiniband
            hostPath: { path: /dev/infiniband, type: DirectoryOrCreate }
          - name: hugepages
            emptyDir: { medium: HugePages }
          - name: shared
            persistentVolumeClaim: { claimName: fsx-pvc }
          - name: shm
            emptyDir: { medium: Memory, sizeLimit: 64Gi }
      envs:
        - { name: DYNAMO_BACKEND, value: "trtllm" }
        - { name: DYN_NAMESPACE,  value: "dynamo-combined-trtllm" }
        - { name: ETCD_ENDPOINTS, value: "http://dynamo-platform-etcd.default.svc.cluster.local:2379" }
        - { name: NATS_SERVER,    value: "nats://dynamo-platform-nats.default.svc.cluster.local:4222" }
        - { name: DYN_SYSTEM_PORT,    value: "9191" }
        - { name: DYN_SYSTEM_ENABLED, value: "true" }
        - { name: NIXL_BACKEND,               value: "LIBFABRIC" }
        - { name: NIXL_SKIP_TOPOLOGY_CHECK,   value: "1" }
        - { name: NIXL_LIBFABRIC_MAX_RAILS,   value: "1" }
        - { name: TRTLLM_NIXL_KVCACHE_BACKEND, value: "LIBFABRIC" }
        - { name: FI_PROVIDER,                value: "efa" }
        - { name: FI_EFA_USE_DEVICE_RDMA,     value: "1" }
        - { name: FI_EFA_ENABLE_SHM,          value: "0" }
        - { name: FI_EFA_ENABLE_SHM_TRANSFER, value: "0" }
        - { name: HF_HOME,                    value: "/shared/nvrx-demo/hf_cache" }
        - name: NIXL_SIDE_CHANNEL_HOST
          valueFrom: { fieldRef: { fieldPath: status.podIP } }
        - { name: NIXL_SIDE_CHANNEL_PORT, value: "5700" }
