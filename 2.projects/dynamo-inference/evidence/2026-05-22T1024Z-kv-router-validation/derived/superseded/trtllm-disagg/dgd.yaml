                --model-path dmvevents/Nemotron-Mini-4B-Instruct \
                --served-model-name dmvevents/Nemotron-Mini-4B-Instruct \
                --disaggregation-mode decode \
                --max-batch-size 32 \
                --max-num-tokens 2048 \
                --override-engine-args "$ENGINE_ARGS"
          resources:
            limits:
              cpu: "16"
              memory: 128Gi
              nvidia.com/gpu: "1"
              vpc.amazonaws.com/efa: "1"
              hugepages-2Mi: 5120Mi
            requests:
